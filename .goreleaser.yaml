---
version: 2
project_name: tidyshare
dist: .artifacts/release

snapshot:
  version_template: "{{ .Env.TIDYSHARE_RELEASE_VERSION }}"

# Darwin uses native CGO jobs in the release workflow.
# The release job combines those assets with these static Linux assets.
builds:
  - main: ./cmd/tidyshare
    binary: tidyshare
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    tags: [remote, exclude_graphdriver_btrfs, containers_image_openpgp]
    flags: [-trimpath]
    ldflags:
      - "{{ .Env.TIDYSHARE_LDFLAGS }}"

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  disable: true

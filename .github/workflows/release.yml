---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare one release identity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      ldflags: ${{ steps.identity.outputs.ldflags }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.3
      - name: Prepare version and linker inputs
        id: identity
        env:
          TIDYSHARE_REF_TYPE: ${{ github.ref_type }}
          TIDYSHARE_REF_NAME: ${{ github.ref_name }}
          TIDYSHARE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TIDYSHARE_VERSION=$(GOTOOLCHAIN=local go run scripts/agent_bundle.go \
            -ref-type "$TIDYSHARE_REF_TYPE" -ref "$TIDYSHARE_REF_NAME" \
            -commit "$TIDYSHARE_SOURCE_COMMIT")
          TIDYSHARE_LDFLAGS=$(GOTOOLCHAIN=local go run scripts/agent_bundle.go \
            -print-ldflags -version "$TIDYSHARE_VERSION" -commit "$TIDYSHARE_SOURCE_COMMIT")
          printf 'version=%s\n' "$TIDYSHARE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'ldflags=%s\n' "$TIDYSHARE_LDFLAGS" >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare, darwin]
    name: Build, attest, and publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      TIDYSHARE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TIDYSHARE_LDFLAGS: ${{ needs.prepare.outputs.ldflags }}
      TIDYSHARE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release mode
        id: mode
        env:
          PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF_TYPE" == tag ]]
            number='(0|[1-9][0-9]*)'
            [[ "$GITHUB_REF_NAME" =~ ^v$number\.$number\.$number(-[0-9A-Za-z.-]+)?$ ]]
            [[ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" == "$GITHUB_SHA" ]]
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        if: ${{ steps.mode.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tags"; then
            echo '::error::Release already exists; inspect it before retrying'
            exit 1
          fi

      - name: Install GoReleaser
        env:
          GORELEASER_VERSION: v2.18.3
          GORELEASER_SHA256: b8dee4728bca1aba0d71a832a17cd0a3799f75372878e7ffa36aef2343bce0bc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goreleaser"
          curl --fail --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/goreleaser.tar.gz" \
            "https://github.com/goreleaser/goreleaser/releases/download/$GORELEASER_VERSION/goreleaser_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$GORELEASER_SHA256" "$RUNNER_TEMP/goreleaser.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/goreleaser.tar.gz" -C "$RUNNER_TEMP/goreleaser" goreleaser

      - name: Start Podman API socket
        run: sudo systemctl enable --now podman.socket

      - name: Build development image
        run: >-
          sudo podman build --pull=always
          --tag localhost/ioplane/tidyshare-dev:1.27.3
          --file Containerfile .

      - name: Verify tree
        run: |
          sudo podman compose run --rm modcheck
          sudo podman compose run --rm fmtcheck
          sudo podman compose run --rm vet
          sudo podman compose run --rm lint
          sudo podman compose run --rm test
          sudo podman compose run --rm race
          sudo podman compose run --rm vuln

      - name: Build offline with GoReleaser
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          args=(release --clean --skip=publish)
          if [[ "$PUBLISH" != true ]]; then
            args+=(--snapshot)
          fi
          sudo --preserve-env=GORELEASER_CURRENT_TAG,TIDYSHARE_RELEASE_VERSION,TIDYSHARE_LDFLAGS,TIDYSHARE_SOURCE_COMMIT podman run --rm \
            --network none \
            --security-opt no-new-privileges=true \
            --volume "$PWD:/workspace:rw" \
            --volume "$RUNNER_TEMP/goreleaser:/tools:ro" \
            --workdir /workspace \
            --env GORELEASER_CURRENT_TAG \
            --env TIDYSHARE_RELEASE_VERSION --env TIDYSHARE_LDFLAGS \
            --env TIDYSHARE_SOURCE_COMMIT --env GOTOOLCHAIN=local \
            --env HOME=/tmp/home --env GOCACHE=/tmp/go-build \
            localhost/ioplane/tidyshare-dev:1.27.3 \
            sh -ec 'go test scripts/agent_bundle.go scripts/agent_bundle_test.go; /tools/goreleaser check; /tools/goreleaser "$@"; go run scripts/agent_bundle.go -source agent-bundle -out .artifacts/release -version "$TIDYSHARE_RELEASE_VERSION" -commit "$TIDYSHARE_SOURCE_COMMIT"' sh "${args[@]}"
          sudo chown -R "$(id -u):$(id -g)" .artifacts
          jq -r '.[] | select(.type == "Binary" and .extra.Format == "binary") | [.path, .name] | @tsv' \
            .artifacts/release/artifacts.json |
            while IFS=$'\t' read -r source name; do
              cp -- "$source" ".artifacts/release/$name"
            done
          (cd .artifacts/release && sha256sum --check tidyshare_v*_checksums.txt)
          sudo --preserve-env=TIDYSHARE_RELEASE_VERSION,TIDYSHARE_LDFLAGS,TIDYSHARE_SOURCE_COMMIT podman run --rm \
            --network none --security-opt no-new-privileges=true \
            --volume "$PWD:/workspace:rw" --workdir /workspace \
            --env TIDYSHARE_RELEASE_VERSION --env TIDYSHARE_LDFLAGS \
            --env TIDYSHARE_SOURCE_COMMIT --env GOTOOLCHAIN=local \
            --env HOME=/tmp/home --env GOCACHE=/tmp/go-build \
            localhost/ioplane/tidyshare-dev:1.27.3 sh -ec '
              for arch in amd64 arm64; do
                set --
                if [ "$arch" = amd64 ]; then set -- -native; fi
                go run scripts/agent_bundle.go \
                  -record-binary ".artifacts/release/tidyshare_v${TIDYSHARE_RELEASE_VERSION}_linux_${arch}" \
                  -receipt ".artifacts/release/binary-linux-${arch}.json" \
                  -version "$TIDYSHARE_RELEASE_VERSION" -commit "$TIDYSHARE_SOURCE_COMMIT" \
                  -build-ldflags "$TIDYSHARE_LDFLAGS" \
                  -goreleaser-metadata .artifacts/release/metadata.json "$@"
              done'
          sudo chown -R "$(id -u):$(id -g)" .artifacts/release

      - name: Download native Darwin binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: darwin-*-${{ github.sha }}
          merge-multiple: true
          path: .artifacts/release

      - name: Check all binary identities and the agent bundle
        run: |
          set -euo pipefail
          cd .artifacts/release
          TIDYSHARE_CHECKSUM=$(find . -maxdepth 1 -name 'tidyshare_v*_checksums.txt' -print)
          [[ -n "$TIDYSHARE_CHECKSUM" && "$TIDYSHARE_CHECKSUM" != *$'\n'* ]]
          sha256sum tidyshare_v*_linux_* tidyshare_v*_darwin_* tidyshare_v*_agent-bundle.tar.gz > "$TIDYSHARE_CHECKSUM"
          sha256sum --check "$TIDYSHARE_CHECKSUM"
          cd "$GITHUB_WORKSPACE"
          sudo --preserve-env=TIDYSHARE_RELEASE_VERSION,TIDYSHARE_SOURCE_COMMIT podman run --rm \
            --network none --security-opt no-new-privileges=true \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --env TIDYSHARE_RELEASE_VERSION --env TIDYSHARE_SOURCE_COMMIT \
            --env GOTOOLCHAIN=local --env HOME=/tmp/home --env GOCACHE=/tmp/go-build \
            localhost/ioplane/tidyshare-dev:1.27.3 sh -ec \
            'go run scripts/agent_bundle.go -verify-assets .artifacts/release -version "$TIDYSHARE_RELEASE_VERSION" -commit "$TIDYSHARE_SOURCE_COMMIT"'

      - name: Create draft and upload release assets
        if: ${{ steps.mode.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" .artifacts/release/tidyshare_v* "${args[@]}"

      - name: Attest build provenance
        if: ${{ steps.mode.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .artifacts/release/tidyshare_v*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: |
            .artifacts/release/tidyshare_v*
            .artifacts/release/metadata.json
            .artifacts/release/artifacts.json
            .artifacts/release/binary-*.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ steps.mode.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release edit "$TAG" --draft=false

  darwin:
    needs: prepare
    name: Darwin ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=remote,exclude_graphdriver_btrfs,containers_image_openpgp
      TMPDIR: /private/tmp
      GOTOOLCHAIN: local
      TIDYSHARE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TIDYSHARE_LDFLAGS: ${{ needs.prepare.outputs.ldflags }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.3
      - name: Verify native code
        run: |
          go vet ./...
          go test -race -count=1 -shuffle=on -timeout=3m ./...
      - name: Build native binary
        env:
          TIDYSHARE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          TIDYSHARE_VERSION="v${TIDYSHARE_RELEASE_VERSION}"
          mkdir -p .artifacts/darwin
          TIDYSHARE_BINARY=".artifacts/darwin/tidyshare_${TIDYSHARE_VERSION}_darwin_${TIDYSHARE_ARCH}"
          go build -trimpath -ldflags "$TIDYSHARE_LDFLAGS" -o "$TIDYSHARE_BINARY" ./cmd/tidyshare
          go run scripts/agent_bundle.go -record-binary "$TIDYSHARE_BINARY" \
            -receipt ".artifacts/darwin/binary-darwin-${TIDYSHARE_ARCH}.json" \
            -version "$TIDYSHARE_RELEASE_VERSION" -commit "$GITHUB_SHA" \
            -build-ldflags "$TIDYSHARE_LDFLAGS" -native
          "$TIDYSHARE_BINARY" doctor -root "$RUNNER_TEMP" -json
      - name: Upload native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-${{ matrix.arch }}-${{ github.sha }}
          path: |
            .artifacts/darwin/tidyshare_*
            .artifacts/darwin/binary-*.json
          if-no-files-found: error

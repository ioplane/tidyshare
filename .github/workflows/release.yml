---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release mode
        id: mode
        env:
          PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF_TYPE" == tag ]]
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" == "$GITHUB_SHA" ]]
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        if: ${{ steps.mode.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tags"; then
            echo '::error::Release already exists; inspect it before retrying'
            exit 1
          fi

      - name: Install GoReleaser
        env:
          GORELEASER_VERSION: v2.18.3
          GORELEASER_SHA256: b8dee4728bca1aba0d71a832a17cd0a3799f75372878e7ffa36aef2343bce0bc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goreleaser"
          curl --fail --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/goreleaser.tar.gz" \
            "https://github.com/goreleaser/goreleaser/releases/download/$GORELEASER_VERSION/goreleaser_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$GORELEASER_SHA256" "$RUNNER_TEMP/goreleaser.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/goreleaser.tar.gz" -C "$RUNNER_TEMP/goreleaser" goreleaser

      - name: Start Podman API socket
        run: sudo systemctl enable --now podman.socket

      - name: Build development image
        run: >-
          sudo podman build --pull=always
          --tag localhost/ioplane/tidyshare-dev:1.27.3
          --file Containerfile .

      - name: Verify tree
        run: |
          sudo podman compose run --rm modcheck
          sudo podman compose run --rm fmtcheck
          sudo podman compose run --rm vet
          sudo podman compose run --rm lint
          sudo podman compose run --rm test
          sudo podman compose run --rm race
          sudo podman compose run --rm vuln

      - name: Build with GoReleaser and upload draft assets
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          GITHUB_TOKEN: ${{ steps.mode.outputs.publish == 'true' && github.token || '' }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          args=(release --clean)
          if [[ "$PUBLISH" != true ]]; then
            args+=(--snapshot)
          fi
          sudo --preserve-env=GITHUB_TOKEN,GORELEASER_CURRENT_TAG podman run --rm \
            --security-opt no-new-privileges=true \
            --volume "$PWD:/workspace:rw" \
            --volume "$RUNNER_TEMP/goreleaser:/tools:ro" \
            --workdir /workspace \
            --env GITHUB_TOKEN --env GORELEASER_CURRENT_TAG \
            --env HOME=/tmp/home --env GOCACHE=/tmp/go-build \
            localhost/ioplane/tidyshare-dev:1.27.3 \
            sh -ec '/tools/goreleaser check; exec /tools/goreleaser "$@"' sh "${args[@]}"
          sudo chown -R "$(id -u):$(id -g)" .artifacts
          cp .artifacts/release/tidyshare_linux_*/* .artifacts/release/
          (cd .artifacts/release && sha256sum --check tidyshare_v*_checksums.txt)

      - name: Attest build provenance
        if: ${{ steps.mode.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .artifacts/release/tidyshare_v*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: |
            .artifacts/release/tidyshare_v*
            .artifacts/release/metadata.json
            .artifacts/release/artifacts.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ steps.mode.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release edit "$TAG" --draft=false
